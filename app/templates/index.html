<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 32px 40px; background: #111827; border-bottom: 3px solid #e11d48; }
    h1 { margin: 0; font-size: 28px; }
    main { padding: 32px 40px; max-width: 900px; }
    .meta { color: #94a3b8; font-size: 14px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #f8fafc; color: #0f172a; border-radius: 6px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #e2e8f0; }
    a { color: #fb7185; }
  </style>
</head>
<body>
  <header>
    <h1>{{ app_name }}</h1>
    <div class="meta">Servidor: {{ host }} &middot; Ambiente: {{ env }} &middot; <a href="/health">/health</a></div>
  </header>
  <main>
    <h2>Solicitações dos cidadãos</h2>
    <table>
      <tr><th>#</th><th>Tipo</th><th>Bairro</th><th>Status</th></tr>
      {% for r in requests %}
      <tr><td>{{ r.id }}</td><td>{{ r.tipo }}</td><td>{{ r.bairro }}</td><td>{{ r.status }}</td></tr>
      {% endfor %}
    </table>
  </main>
</body>
</html>
