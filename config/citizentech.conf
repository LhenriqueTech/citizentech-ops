# =============================================================================
#  CitizenTech - Arquivo central de configuração do provisionamento
#  Todos os scripts em scripts/ leem este arquivo. Qualquer variável aqui
#  também pode ser sobrescrita por variável de ambiente na hora da execução:
#     sudo APP_PORT=8080 bash provision.sh
# =============================================================================

# ----------------------------- Infraestrutura --------------------------------
HOST_NAME="${HOST_NAME:-citizentech-srv01}"
DOMAIN="${DOMAIN:-citizentech.local}"
APP_DOMAIN="${APP_DOMAIN:-app.citizentech.local}"
TIMEZONE="${TIMEZONE:-America/Sao_Paulo}"

# Rede: "dhcp" mantém o IP atual da VM; "static" grava um netplan com IP fixo.
NET_MODE="${NET_MODE:-dhcp}"
NET_IFACE="${NET_IFACE:-}"                     # vazio = interface da rota padrão
STATIC_IP="${STATIC_IP:-192.168.56.10/24}"
STATIC_GW="${STATIC_GW:-}"                     # vazio = sem gateway nessa interface
DNS_SERVERS="${DNS_SERVERS:-1.1.1.1 8.8.8.8}"
FALLBACK_DNS="${FALLBACK_DNS:-9.9.9.9 8.8.4.4}"
FIREWALL_ALLOW="${FIREWALL_ALLOW:-22/tcp 80/tcp}"

# ------------------------------- Aplicação -----------------------------------
APP_NAME="${APP_NAME:-citizentech}"
APP_USER="${APP_USER:-citizentech}"
APP_BASE="${APP_BASE:-/opt/citizentech}"
APP_DATA_DIR="${APP_DATA_DIR:-/var/lib/citizentech}"   # dados persistentes (banco SQLite)

# De onde vem o código:
#   local -> pasta do próprio repositório (APP_LOCAL_PATH)
#   git   -> clona APP_REPO_URL (ex.: o repositório da outra disciplina)
APP_SOURCE="${APP_SOURCE:-local}"
APP_LOCAL_PATH="${APP_LOCAL_PATH:-app}"
APP_REPO_URL="${APP_REPO_URL:-}"
APP_BRANCH="${APP_BRANCH:-main}"
APP_SUBDIR="${APP_SUBDIR:-}"                   # ex.: "backend" se o app estiver numa subpasta

# Tipo: auto | python | node | java | dotnet | static
APP_TYPE="${APP_TYPE:-auto}"
APP_PORT="${APP_PORT:-5000}"
APP_HEALTH_PATH="${APP_HEALTH_PATH:-/health}"  # use "/" se o app não tiver /health
APP_ENV="${APP_ENV:-production}"
APP_START_CMD="${APP_START_CMD:-}"             # vazio = comando padrão do tipo
APP_BUILD_CMD="${APP_BUILD_CMD:-}"             # ex.: "npm run build"
STATIC_ROOT="${STATIC_ROOT:-}"                 # vazio = detecta dist/ build/ public/ .

# Runtimes
PYTHON_WSGI="${PYTHON_WSGI:-app:app}"
GUNICORN_WORKERS="${GUNICORN_WORKERS:-2}"
NODE_MAJOR="${NODE_MAJOR:-20}"
JAVA_VERSION="${JAVA_VERSION:-17}"
JAVA_OPTS="${JAVA_OPTS:--Xms128m -Xmx512m}"
DOTNET_VERSION="${DOTNET_VERSION:-8.0}"

# ------------------------------ Monitoramento --------------------------------
MONITOR_INTERVAL="${MONITOR_INTERVAL:-15}"     # segundos entre coletas
CPU_WARN="${CPU_WARN:-70}";   CPU_CRIT="${CPU_CRIT:-90}"
MEM_WARN="${MEM_WARN:-75}";   MEM_CRIT="${MEM_CRIT:-90}"
DISK_WARN="${DISK_WARN:-80}"; DISK_CRIT="${DISK_CRIT:-90}"
DISK_PATHS="${DISK_PATHS:-/}"
ALERT_COOLDOWN="${ALERT_COOLDOWN:-300}"        # não repete o mesmo alerta antes disso
ALERT_WEBHOOK_URL="${ALERT_WEBHOOK_URL:-}"     # Teams / Slack / Discord (opcional)
MONITOR_SERVICES="${MONITOR_SERVICES:-citizentech-app nginx}"
AUTO_HEAL="${AUTO_HEAL:-true}"                 # reinicia serviços caídos

# --------------------------------- Logs --------------------------------------
LOG_DIR="${LOG_DIR:-/var/log/citizentech}"
